kotlinx-serialization-json = "1.12.0"
kotlinx-serialization-yaml = "0.104.0"
kotlinx-serialization-xml = "1.0.2.1"
kotlinx-io = "0.9.1"
sentry = "6.24.0"
prometheus = "1.17.2"
jib = "3.5.4"
ktor = "3.6.0"
koin-bom = "4.2.2"
buildconfig = "6.1.2"
kache = "2.1.1"

exposed = "1.6.0"
